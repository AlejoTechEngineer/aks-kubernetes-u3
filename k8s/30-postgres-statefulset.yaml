# APLICACIÓN 3 — Carga con estado (stateful): PostgreSQL
# Conceptos que demuestra: StatefulSet, Service headless, PersistentVolumeClaim
# dinámico sobre Azure Disk (StorageClass managed-csi), Secret.
# El Secret "pg-credentials" NO se versiona: lo crea scripts/02-desplegar.sh
# con una contraseña aleatoria (nunca subir credenciales al repositorio).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None              # headless: DNS estable por pod (postgres-0.postgres)
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  labels:
    app.kubernetes.io/part-of: aks-u3
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: demo
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
            - name: PGDATA                  # subcarpeta: el volumen trae lost+found en la raíz
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "appdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "appdb"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi    # Azure Disk (CSI) — StorageClass por defecto de AKS
        resources:
          requests:
            storage: 1Gi
