# APLICACIÓN 2 — Microservicios: frontend + Redis (Azure Vote, ejemplo oficial de Microsoft)
# Conceptos que demuestra: comunicación entre servicios por DNS interno
# (azure-vote-back.vote.svc.cluster.local), Services ClusterIP vs LoadBalancer,
# escalado independiente de cada microservicio.
# Nota: verifica que las imágenes sigan vigentes en el quickstart oficial de AKS
# antes de grabar (las etiquetas pueden cambiar con el tiempo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-vote-back
  namespace: vote
  labels:
    app.kubernetes.io/name: azure-vote-back
    app.kubernetes.io/part-of: aks-u3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-vote-back
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-vote-back
    spec:
      containers:
        - name: redis
          image: mcr.microsoft.com/oss/bitnami/redis:6.0.8
          env:
            - name: ALLOW_EMPTY_PASSWORD     # solo para demo; en producción usar Secret + Key Vault
              value: "yes"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: azure-vote-back
  namespace: vote
spec:
  type: ClusterIP              # solo accesible dentro del clúster
  selector:
    app.kubernetes.io/name: azure-vote-back
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-vote-front
  namespace: vote
  labels:
    app.kubernetes.io/name: azure-vote-front
    app.kubernetes.io/part-of: aks-u3
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-vote-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-vote-front
    spec:
      containers:
        - name: azure-vote-front
          image: mcr.microsoft.com/azuredocs/azure-vote-front:v1
          env:
            - name: REDIS
              value: azure-vote-back   # resolución por DNS del Service
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: azure-vote-front
  namespace: vote
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: azure-vote-front
  ports:
    - name: http
      port: 80
      targetPort: http
